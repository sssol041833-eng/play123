<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운동기록기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="운동기록기 홈">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span>운동기록기</span>
      </a>
      <a class="settings-button" href="setting.html" aria-label="설정 열기">
        <span class="settings-icon" aria-hidden="true">⚙</span>
        설정
      </a>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">TODAY'S WORKOUT</p>
      <h1 id="page-title">운동기록기</h1>
      <p class="intro-copy">오늘의 움직임을 기록하고, 나만의 리듬을 만들어보세요.</p>
    </section>

    <section class="dashboard" aria-label="운동 기록 대시보드">
      <article class="timer-panel">
        <div class="panel-heading">
          <div>
            <p class="section-label">남은 시간</p>
              <p class="timer-status"><span class="status-dot"></span><span id="timer-status">운동 준비됨</span></p>
          </div>
          <span class="date-label">2026. 09. 19</span>
        </div>

        <div class="timer-display" aria-label="남은 시간 45분 00초">
          <span id="remaining-minutes">45</span><small>분</small>
          <span id="remaining-seconds">00</span><small>초</small>
        </div>

        <div class="progress-track" id="progress-track" aria-label="진행률 0퍼센트">
          <div class="progress-value" id="progress-value"></div>
        </div>
        <div class="progress-meta">
          <span id="progress-status">시작 전</span>
          <span>총 <span id="total-minutes">45</span>분</span>
        </div>

        <div class="timer-actions">
          <button class="button button-primary" type="button" onclick="startTimer()"><span aria-hidden="true">▶</span> 시작</button>
          <button class="button button-secondary" type="button" onclick="stopTimer()"><span aria-hidden="true">Ⅱ</span> 정지</button>
          <button class="button button-ghost" type="button" onclick="resetTimer()"><span aria-hidden="true">↻</span> 초기화</button>
        </div>
      </article>

      <article class="exercise-panel">
        <div class="panel-heading">
          <div>
            <p class="section-label">운동 종류</p>
            <p class="panel-description">오늘 할 운동을 선택하세요.</p>
          </div>
          <span class="selection-count">01 / 04</span>
        </div>

        <fieldset class="exercise-list">
          <legend class="visually-hidden">운동 종류 선택</legend>
          <label class="exercise-option">
            <input type="radio" name="exercise" value="45" checked onchange="selectExercise(this)">
            <span class="exercise-symbol cycle" aria-hidden="true">↗</span>
            <span class="exercise-info"><strong>사이클</strong><small>지구력 · 45분</small></span>
            <span class="radio-mark" aria-hidden="true"></span>
          </label>
          <label class="exercise-option">
            <input type="radio" name="exercise" value="30" onchange="selectExercise(this)">
            <span class="exercise-symbol jog" aria-hidden="true">↝</span>
            <span class="exercise-info"><strong>조깅</strong><small>가벼운 유산소 · 30분</small></span>
            <span class="radio-mark" aria-hidden="true"></span>
          </label>
          <label class="exercise-option">
            <input type="radio" name="exercise" value="90" onchange="selectExercise(this)">
            <span class="exercise-symbol marathon" aria-hidden="true">↯</span>
            <span class="exercise-info"><strong>마라톤</strong><small>고강도 달리기 · 90분</small></span>
            <span class="radio-mark" aria-hidden="true"></span>
          </label>
          <label class="exercise-option">
            <input type="radio" name="exercise" value="120" onchange="selectExercise(this)">
            <span class="exercise-symbol hiking" aria-hidden="true">⌁</span>
            <span class="exercise-info"><strong>등산</strong><small>전신 활동 · 120분</small></span>
            <span class="radio-mark" aria-hidden="true"></span>
          </label>
        </fieldset>
      </article>
    </section>

    <footer class="footer-note">
      <span class="footer-line"></span>
      <span>꾸준함이 가장 좋은 기록입니다.</span>
      <span class="footer-line"></span>
    </footer>
  </main>
</body>
</html>
